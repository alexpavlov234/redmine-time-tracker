<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redmine Time Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --bg-body: #f8f9fa;
      --bg-card: #ffffff;
      --text-primary: #212529;
      --text-secondary: #495057;
      --text-muted: #868e96;
      --border-color: #dee2e6;
      --border-subtle: #e9ecef;
      --accent-blue: #1971c2;
      --accent-blue-light: #e7f5ff;
      --accent-blue-border: #a5d8ff;
      --accent-teal: #0ca678;
      --accent-teal-hover: #099268;
      --input-bg: #ffffff;
      --input-border: #ced4da;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #1a1b1e;
        --bg-card: #25262b;
        --text-primary: #e9ecef;
        --text-secondary: #c1c2c5;
        --text-muted: #909296;
        --border-color: #373a40;
        --border-subtle: #2c2e33;
        --accent-blue: #4dabf7;
        --accent-blue-light: rgba(25, 113, 194, 0.2);
        --accent-blue-border: #1971c2;
        --accent-teal: #12b886;
        --accent-teal-hover: #0ca678;
        --input-bg: #1a1b1e;
        --input-border: #373a40;
      }
    }

    body {
      width: 330px;
      padding: 16px;
      background: var(--bg-body);
      color: var(--text-primary);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .badge-online {
      background: #d3f9d8;
      color: #2b8a3e;
    }

    .badge-offline {
      background: #ffe3e3;
      color: #e03131;
    }

    @media (prefers-color-scheme: dark) {
      .badge-online {
        background: rgba(43, 138, 62, 0.25);
        color: #69db7c;
      }

      .badge-offline {
        background: rgba(224, 49, 49, 0.25);
        color: #ff8787;
      }
    }

    /* Toggle switch row */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-card);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      margin-bottom: 12px;
    }

    .toggle-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    /* Switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ced4da;
      transition: .3s;
      border-radius: 22px;
    }

    @media (prefers-color-scheme: dark) {
      .slider {
        background-color: #495057;
      }
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #228be6;
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    /* Active Task Card */
    .timer-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .timer-status {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .timer-task {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-blue);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .timer-project {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .timer-display {
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      text-align: center;
      margin: 8px 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      border: none;
      transition: background 0.2s, opacity 0.2s;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-stop {
      background: #fa5252;
      color: #ffffff;
    }

    .btn-stop:hover:not(:disabled) {
      background: #e03131;
    }

    .btn-start-notask {
      background: var(--accent-teal);
      color: #ffffff;
      margin-top: 6px;
    }

    .btn-start-notask:hover:not(:disabled) {
      background: var(--accent-teal-hover);
    }

    .btn-app {
      background: var(--accent-blue-light);
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue-border);
      margin-bottom: 8px;
    }

    .btn-app:hover {
      opacity: 0.9;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 12.5px;
      padding: 8px 0;
      line-height: 1.4;
    }

    /* Collapsible Settings Section */
    .settings-details {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
    }

    .settings-details summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      outline: none;
    }

    .settings-content {
      margin-top: 10px;
    }

    .field-group {
      margin-bottom: 8px;
    }

    .field-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 3px;
    }

    .field-group input {
      width: 100%;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-primary);
      outline: none;
    }

    .field-group input:focus {
      border-color: #339af0;
    }

    .btn-save-settings {
      background: #2b8a3e;
      color: #ffffff;
      padding: 6px 10px;
      font-size: 12px;
      width: 100%;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-save-settings:hover {
      background: #237032;
    }

    .save-status {
      font-size: 11px;
      color: #2b8a3e;
      margin-top: 6px;
      display: none;
      text-align: center;
      line-height: 1.35;
    }

    .save-status.is-warning {
      color: #d9480f;
    }

    @media (prefers-color-scheme: dark) {
      .save-status {
        color: #69db7c;
      }

      .save-status.is-warning {
        color: #ffa94d;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Redmine Time Tracker</div>
    <span id="server-status" class="badge badge-offline">Офлайн</span>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Показвай бутона за таймера в страниците на задачите</span>
    <label class="switch">
      <input type="checkbox" id="toggle-enabled" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="timer-card" id="timer-box">
    <div class="timer-status" id="timer-state-label">Статус</div>
    <div id="active-task-content">
      <div class="empty-state">В момента няма активен таймер.</div>
    </div>
  </div>

  <a href="http://localhost:5173" target="_blank" class="btn btn-app" id="open-app-btn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    <span>Отвори уеб приложението</span>
  </a>

  <details class="settings-details">
    <summary>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Настройки за връзка</span>
    </summary>
    <div class="settings-content">
      <div class="field-group">
        <label for="cfg-redmine-url">Адрес на Redmine (URL):</label>
        <input type="text" id="cfg-redmine-url" placeholder="https://redmine.example.com">
      </div>
      <div class="field-group">
        <label for="cfg-api-key">API ключ за достъп:</label>
        <input type="password" id="cfg-api-key" placeholder="Въведете вашия API ключ от Redmine">
      </div>
      <button type="button" class="btn-save-settings" id="btn-save-config">Запази настройките</button>
      <div class="save-status" id="cfg-save-status">Настройките бяха запазени успешно!</div>
    </div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
